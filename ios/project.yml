# XcodeGen project definition. The .xcodeproj is generated, never committed —
# regenerate with `xcodegen generate` from this directory.
#
# Two directories this file references are build output, staged by the npm
# scripts before Xcode runs (see docs/building.md):
#
#   HomerunHost/web/   the shared UI bundle      npm run ui:ios
#   HomerunHost/lib/   libhomerun_pumpkin_ffi.a  npm run rust:ios / rust:ios-sim
#
# `xcodegen generate` FAILS if web/ is missing. That is deliberate: a project
# that builds without the UI produces an app with a blank screen, which is a
# far more expensive thing to debug than a missing-directory error.

name: HomerunHost

options:
  bundleIdPrefix: app.gethomerun
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Both must be numeric and period-separated — Apple rejects a build whose
    # version says "beta". Pre-release is expressed by the leading 0, not by
    # a word, and TestFlight shows this as "0.0.1 (2026081201)".
    MARKETING_VERSION: "0.0.1"
    # The build number, invisible to players and unrelated to the version
    # above. Apple rejects a duplicate, so this is the upload date plus a
    # counter rather than a 1 someone has to remember to bump: yyyymmddNN.
    CURRENT_PROJECT_VERSION: "2026082101"
    # The backend a build talks to. Reaches the app through `HomerunAPIURL` in
    # Info.plist, read by `HostStore.apiURL` when the page has not stored one.
    # Android's `-PapiUrl` equivalent, with the same production default:
    #
    #   xcodebuild … HOMERUN_API_URL=https://api.fractalnetworks.co
    #
    # A backend picked inside the app outranks this, so moving a device that has
    # already run means clearing its data — the same rule as `--fresh` on
    # Android. See `docs/building.md`.
    HOMERUN_API_URL: https://api.gethomerun.app
    # Whether this build has anything to do with over-the-air UI bundles.
    # Reaches the app through `HomerunOTAUpdates` in Info.plist, read by
    # `Capabilities.otaUpdates`. Android's `-PotaUpdates=off` equivalent:
    #
    #   xcodebuild … HOMERUN_OTA_UPDATES=0
    #
    # `0` means *ignore them entirely*, not merely "do not fetch": nothing is
    # downloaded, and a bundle already in Application Support is neither
    # promoted nor served. Nothing on disk is deleted, so a build with it back
    # on carries on where it left off.
    #
    # On by default, including for Debug — the update path is only ever
    # exercised on a debug build, so defaulting it off in development would
    # mean nobody sees it work until a release. **Never ship a release with
    # this off**: it would look completely healthy and silently never update
    # again, and unlike Android there is no Gradle task here to refuse one.
    HOMERUN_OTA_UPDATES: "1"

# The only third-party Swift dependency in the app.
#
# iOS ships no zip API at all — not in Foundation, not in Compression (raw
# streams, no container), not in AppleArchive (a different format entirely). A
# UI bundle arrives as a zip because that is what the publish workflow produces
# and what Android's java.util.zip reads, so something here has to open it.
#
# The alternative was a zip container parser over Compression: roughly 200
# lines of offset arithmetic guarding the one path in this app that unpacks an
# archive it did not create. This is the safer trade. `BundleUpdater` still
# walks entries by hand rather than calling `unzipItem`, so the path-traversal
# refusal and the size ceilings are ours and match Android's.
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  # Remote push (the `remotePush` capability, bridge revision 9). FCM relays
  # to iOS through APNs; only FirebaseMessaging is linked, but SPM resolves
  # the whole firebase-ios-sdk graph (FirebaseCore, GoogleUtilities,
  # GoogleDataTransport, nanob and friends), which is the dependency cost the
  # plan priced in — see plans/push-notifications.md, "FCM for both
  # platforms". Analytics is deliberately not linked.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  HomerunHost:
    type: application
    platform: iOS

    dependencies:
      - package: ZIPFoundation
      - package: Firebase
        product: FirebaseMessaging
      # The wireproxy tunnel, gomobile-bound so it runs in-process — iOS
      # cannot spawn the binary the way desktop and Android do. Staged by
      # `node scripts/build-wireproxy.js ios`, so that must run before
      # `xcodegen generate`.
      - framework: HomerunHost/lib/WireproxyIOS.xcframework
        embed: true
        codeSign: true

    sources:
      - path: HomerunHost
        excludes:
          - web            # folder reference below; would otherwise be flattened
          - lib            # build output, linked not compiled
          - AppIcon.icon   # a bundle, added whole below
      # The Icon Composer source. It is a directory, but actool compiles it as
      # one unit, so it has to reach the project as a single file reference —
      # left to the glob above it would arrive as a loose .json and .svg and
      # the app would build with no icon at all.
      - path: HomerunHost/AppIcon.icon
        type: file
        buildPhase: resources
      # A folder reference, so the whole tree lands in the bundle as `web/`
      # and restaging the UI needs no `xcodegen generate`.
      - path: HomerunHost/web
        type: folder
        buildPhase: resources
      # Capabilities are read out of this at runtime rather than transcribed
      # into Swift, so the injected object cannot drift from the contract the
      # conformance checker enforces.
      - path: ../shared/conformance/bridge-v1.json
        buildPhase: resources
      # The Firebase config, staged BY BACKEND before `xcodegen generate`:
      #
      #   cp ../{staging|prod}-ios-GoogleService-Info.plist HomerunHost/GoogleService-Info.plist
      #
      # The pairing that matters is app Firebase project <-> backend FCM
      # credential — crossing them fails at send time as SENDER_ID_MISMATCH,
      # far from the mistake (docs/building.md, "Push credentials"). It is
      # genuinely optional, but not as a source entry: XcodeGen's `optional`
      # only forgives the file at *generation* time and still emits the build
      # input, so a plist-less build failed with "Build input file cannot be
      # found" rather than running with push inert. It is copied by the
      # postBuildScripts phase below instead, which is what makes the absence
      # a runtime condition (`configureIfPossible`) the way the plan intends.

    # Copies GoogleService-Info.plist into the app when one is staged, and
    # does nothing when one is not. This is the whole reason the plist is not
    # a `sources:` entry — see the note above it. Runs before Xcode signs, so
    # the copy is inside the signature rather than invalidating it.
    postBuildScripts:
      - name: Stage GoogleService-Info.plist (optional)
        # No inputFiles/outputFiles deliberately: declaring an output that a
        # plist-less build never produces makes Xcode report a phase that
        # "did not produce its expected output" on every build.
        script: |
          set -eu
          SRC="$SRCROOT/HomerunHost/GoogleService-Info.plist"
          DEST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST/GoogleService-Info.plist"
            echo "note: staged GoogleService-Info.plist — remote push is live"
          else
            rm -f "$DEST/GoogleService-Info.plist"
            echo "note: no GoogleService-Info.plist — remote push inert in this build"
          fi

    settings:
      base:
        PRODUCT_NAME: Homerun
        PRODUCT_BUNDLE_IDENTIFIER: app.gethomerun.ios
        INFOPLIST_FILE: HomerunHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: HomerunHost/HomerunHost.entitlements
        TARGETED_DEVICE_FAMILY: "1"        # iPhone; the UI is untested on iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # HomerunHost/AppIcon.icon
        SWIFT_OBJC_BRIDGING_HEADER: HomerunHost/FFI/HomerunFFI.h

        # The Hintjen PBC team. Not a secret — a Team ID is public in every
        # signed binary — so it is checked in rather than left to each
        # machine's Xcode to guess. Automatic signing takes it from here and
        # mints the certificate and profile itself.
        DEVELOPMENT_TEAM: 35DS8JGY4Y
        #
        # Do NOT turn signing off to avoid needing a team. An unsigned app has
        # no application identifier, so the Keychain rejects every write with
        # errSecMissingEntitlement (-34018) — which surfaces much later as the
        # app behaving as though it were never signed in.
        CODE_SIGN_STYLE: Automatic

        # scripts/targets.js stages the device and simulator slices to
        # different directories; pick per SDK rather than building a fat lib.
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(inherited)"
          - "$(SRCROOT)/HomerunHost/lib"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(inherited)"
          - "$(SRCROOT)/HomerunHost/lib/sim"

        # -lresolv and these frameworks are what the Rust standard library and
        # its networking dependencies resolve against; without them the link
        # fails on symbols no Swift source mentions. Learned from the
        # prototype — do not prune speculatively.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lhomerun_pumpkin_ffi"
          - "-lresolv"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework CoreFoundation"
          - "-framework Network"

        # build-rust.js produces arm64 only for the simulator.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
