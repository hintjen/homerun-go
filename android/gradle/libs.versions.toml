[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
activity = "1.9.3"
lifecycle = "2.8.7"
webkit = "1.12.1"
coroutines = "1.9.0"
serialization = "1.7.3"
commonsCompress = "1.27.1"
xz = "1.10"
firebaseMessaging = "24.1.0"
googleServices = "4.4.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# Android ships no tar or xz reader, and the published JRE archives are
# .tar.xz. commons-compress does tar; it delegates xz to tukaani.
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
tukaani-xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
# Remote push. The one Play-services dependency in the app; the BoM is not
# used because this is the only Firebase artifact and a BoM would suggest
# otherwise.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Reads google-services.json into BuildConfig-adjacent resources. The file
# itself is staged per backend by stageGoogleServices in app/build.gradle.kts.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
