[package]
name = "homerun-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The host logic shared by the desktop, iOS and Android apps: what to download, how to reach the gateway, and what state a server is in"

# Deliberately NOT part of a Cargo workspace. Both sibling crates carry their
# own `[profile.release]` (opt-level = "z", lto, strip) and Cargo only honours
# profiles at a workspace root — adding one here would silently drop those and
# bloat what ships. Consumers depend on this by path instead.

[lib]
# rlib for the sibling crates that link it, cdylib/staticlib so the same code
# can be reached over the existing JNI and C ABI surfaces without a second
# copy of anything.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The one exception to "serde and nothing else", argued at length in
# `bundle.rs`: an over-the-air bundle replaces the entire UI, so the signature
# on its manifest is the only thing standing between a compromised CDN and a
# compromised app. `md5.rs` exists to avoid a dependency for a hash nothing
# trusts; that reasoning inverts for signature verification, where a
# hand-rolled implementation still accepts every honest signature while
# quietly accepting forged ones as well. Verification needs no RNG, so this
# pulls in no `getrandom` and nothing platform-specific.
ed25519-dalek = "2"

# The second exception, and desktop-only: behind `client-manifests`, which no
# mobile build enables. Starting a Game Pass game means reading two XML files
# Windows games ship, `AppxManifest.xml` (which applications a package has)
# and `MicrosoftGame.config` (which executable each one really runs). Both use
# namespaces, entities and comments, which a hand-rolled reader gets quietly
# wrong. roxmltree is a read-only tree with no dependencies of its own, and it
# refuses a DTD by default, so an entity-expansion file is a parse error
# rather than a memory bomb. See `engine::client::manifest`.
roxmltree = { version = "0.21", optional = true }

[features]
# Reading Windows game manifests (`engine::client::manifest`). For the
# desktop's runner only: a phone never starts a Game Pass game, so the
# mobile builds leave it off and ship no XML parser.
client-manifests = ["dep:roxmltree"]

# The reference game extension (`engine::extensions::fixture`), for the
# runner's tests. Never enabled in a release build: it is always on for this
# crate's own tests, and nothing a player runs should know its name.
test-extensions = []

[profile.release]
opt-level = "z"
lto = true
strip = true
