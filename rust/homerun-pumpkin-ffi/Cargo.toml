[package]
name = "homerun-pumpkin-ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "C ABI around the Pumpkin server for the Homerun iOS and Android hosts"

[lib]
# staticlib -> iOS links libhomerun_pumpkin_ffi.a
# cdylib    -> Android loads libhomerun_pumpkin_ffi.so
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Pumpkin stays an ordinary dependency at a pinned rev. Keeping our FFI in
# this crate means upstream's Cargo.toml needs no crate-type change, which is
# one less thing carried in the fork.
#
# Point this at hintjen/Pumpkin until the library-mode patches land upstream:
#   - no process::exit on bind failure (it kills the host app)
#   - reset_server_state() so restart-in-process works
#   - STOP_INTERRUPT as ArcSwap
#   - dlopen plugin loader cfg'd off iOS
#   - wasmtime configured for Pulley (iOS forbids JIT)
# pumpkin = { git = "https://github.com/hintjen/Pumpkin", rev = "<pin>" }

serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"
# The level filter android_logger is configured with comes from here. Declared
# rather than borrowed transitively — undeclared imports have bitten us before.
log = "0.4"

[profile.release]
# The debug build of the server is ~1.8 GB, which is impractical on device.
opt-level = "z"
lto = true
strip = true
