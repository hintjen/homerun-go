[package]
name = "homerun-pumpkin-bin"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Pumpkin as a child process, so a server crash cannot take the app with it"

# An ordinary executable. It ships as `libpumpkin.so` in jniLibs, which is the
# only way Android will let us exec it — same rule and same rename as
# `homerun-java-launcher`. See docs/android-server-backend.md.
[[bin]]
name = "homerun-pumpkin"
path = "src/main.rs"

[dependencies]
# The same fork at the same rev as `homerun-pumpkin-ffi`. These two must not
# drift: the FFI crate's `pumpkin_settings` writes the config this binary
# reads, and a settings key that moved between revs would be written to a file
# the running server does not read. There is a test for this — see
# `scripts/check-pumpkin-rev.js`.
pumpkin = { git = "https://github.com/hintjen/Pumpkin", rev = "09f1d4dfbe524292b3996f1242157b23b90177e4" }
pumpkin-config = { git = "https://github.com/hintjen/Pumpkin", rev = "09f1d4dfbe524292b3996f1242157b23b90177e4" }
pumpkin-data = { git = "https://github.com/hintjen/Pumpkin", rev = "09f1d4dfbe524292b3996f1242157b23b90177e4" }

# The settings machinery, reused rather than reimplemented. `engine_settings`
# resolves what a player asked for into what an engine will accept — clamps,
# UUIDs, advisories — and `pumpkin_settings` assigns it onto Pumpkin's own
# config types. Rendering a `pumpkin.toml` by hand instead would mean spelling
# every key and every enum's serde representation a second time, and getting
# one wrong is silent: `GameMode` serialises as "Survival", so a lower-cased
# guess would be dropped on load and the server would start on defaults.
homerun-pumpkin-ffi = { path = "../homerun-pumpkin-ffi", features = ["pumpkin-engine"] }
homerun-core = { path = "../homerun-core" }

serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

# Cargo only honours a profile at a workspace root and there is no workspace
# here, so every crate states its own.
#
# **Full LTO, and it is expensive.** Over this dependency tree — Pumpkin plus
# wasmtime and cranelift — the link takes roughly twenty minutes and peaks near
# 7 GB in a single rustc process, and it re-runs on *any* source change in this
# crate. Budget for that before editing: a one-line fix costs a full relink.
#
# It is kept anyway because this is what ships. Measured on x86_64:
#
#   lto = true    71.7 MB
#   lto = "thin"  88.9 MB
#
# 17 MB is what keeps the move to a child process size-neutral — the library
# it replaces was 79.8 MB with the engine linked in, so full LTO lands the pair
# at ~78 MB and thin lands them at ~96 MB. If you need to iterate, build with
# `--profile dev` rather than making the shipped artifact bigger for everyone.
[profile.release]
opt-level = 3
lto = true
strip = true
