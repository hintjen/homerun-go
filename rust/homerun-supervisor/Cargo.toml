[package]
name = "homerun-supervisor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The supervisor: owns a running server — state machine, console, stop ladder, crash capture, sampling — for a linked engine and a child process alike, behind a C ABI"

[lib]
# The **package** is `homerun-supervisor`; this lib target deliberately is not.
#
# The file name is load-bearing in three places that this rename must not
# touch, because none of them is rebuilt from this manifest:
#
#   - Android calls `System.loadLibrary("homerun_pumpkin_ffi")` and the APK
#     packages `libhomerun_pumpkin_ffi.so` by that name
#   - iOS links `-lhomerun_pumpkin_ffi` against `libhomerun_pumpkin_ffi.a`
#   - a crash backtrace off a device names frames
#     `homerun_pumpkin_ffi::…` inside `libhomerun_pumpkin_ffi.so`, which is
#     what `homerun-core::reporting::app_error::fingerprint` groups on — so
#     moving it would split every existing report's fingerprint in two
#
# `[lib] name` is what decides all three, so it stays put and the rename stops
# at the package. Moving the artifact is a separate, separately-verified
# change (it needs the Android and iOS builds, not just this crate's suite) —
# or never; the name costs nothing where it is.
#
# Dependents do not inherit the old spelling: each renames this back to
# `homerun_supervisor` with an explicit `package =` key, so Rust source says
# the name the package has. See `rust/homerun-pumpkin-bin/Cargo.toml`.
name = "homerun_pumpkin_ffi"
# staticlib -> iOS links libhomerun_pumpkin_ffi.a
# cdylib    -> Android loads libhomerun_pumpkin_ffi.so
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Links the real server. Off by default so the rest of the crate — state
# machine, console buffer, pre-flight, crash capture, the whole C surface —
# builds and tests in seconds on any machine, with no Pumpkin and no device.
# The iOS and Android builds turn it on; see scripts/build-rust.js.
pumpkin-engine = [
    "dep:pumpkin",
    "dep:pumpkin-config",
    "dep:pumpkin-data",
    "dep:pumpkin-util",
    "dep:tokio",
    "dep:uuid",
    "dep:time",
]
# Links a restic-compatible backup engine into the app. **iOS only.** Android
# spawns the restic binary instead (scripts/build-restic.js), so turning this
# on there would add ~5.6 MB for something it already has a better answer for.
# The C surface exists either way; without this it answers "no engine".
backup-engine = ["dep:rustic_core", "dep:rustic_backend", "dep:jiff"]

# Supervises the server as a **child process**. Android and any desktop host;
# never iOS, which cannot spawn one at all — see scripts/targets.js for which
# build turns it on. Off by default like the others, but `npm run test:rust`
# enables it, because its tests are the only coverage process supervision has
# ever had and they need no device.
process-engine = ["dep:libc", "dep:windows-sys"]

# Everything a *descriptor-driven* game needs that `homerun-core::engine`
# deliberately cannot do: fetch a runtime, verify and unpack it, drive
# steamcmd, and speak RCON to a server that has no stdin worth talking to.
#
# Off by default like the rest, and for the same reason: it is the second
# heaviest thing here after `device-ws` -- an HTTP client, a zip reader and a
# websocket -- and the fast suite is what makes this crate testable on any
# machine in seconds. `npm run test:rust` turns it on, because its tests are
# the only coverage the fetcher and the console transports have.
#
# Implies `process-engine`: a descriptor-driven game is a child process, so
# there is nothing here without one.
game-engine = [
    "process-engine",
    "dep:tokio",
    "dep:reqwest",
    "dep:tungstenite",
    "dep:sha2",
    "dep:zip",
]

# Serves `wss://<device-fqdn>` so the dashboard can reach this device's console
# and RCON directly. Off by default and by some distance the heaviest feature
# here — a TLS stack, an HTTP client and a JWT verifier — so the rest of the
# crate keeps building and testing in seconds without it. The protocol it
# speaks is decided in `homerun_core::device_ws::protocol`, which is pure and
# always compiled. See plans/device-websocket.md.
device-ws = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:reqwest",
    "dep:jsonwebtoken",
    "dep:tokio-rustls",
    "dep:instant-acme",
    "dep:http",
    "dep:http-body-util",
    "dep:bytes",

]

[dependencies]
# Pumpkin stays an ordinary dependency at a pinned rev. Keeping our FFI in
# this crate means upstream's Cargo.toml needs no crate-type change, which is
# one less thing carried in the fork.
#
# hintjen/Pumpkin-homerun carries the library-mode patches on `main`. It is a
# public repository -- no deploy key, no URL rewrite, no credential of any kind
# is needed to fetch it:
#   - PumpkinServer::new returns Result rather than calling process::exit
#     (an exit kills the host app with no report)
#   - reset_server_state() so restart-in-process works
#   - STOP_INTERRUPT as ArcSwap
#   - dlopen plugin loader cfg'd off iOS
#   - wasmtime configured for Pulley (iOS forbids JIT)
#
# Pinned to an exact rev on purpose: upstream tracks Minecraft protocol
# releases, and that churn must not land in an app build uninvited.
pumpkin = { git = "https://github.com/hintjen/Pumpkin-homerun", rev = "62a095ba017e35e67fb48b44e2d5acea3b1608a7", optional = true }
pumpkin-config = { git = "https://github.com/hintjen/Pumpkin-homerun", rev = "62a095ba017e35e67fb48b44e2d5acea3b1608a7", optional = true }
pumpkin-util = { git = "https://github.com/hintjen/Pumpkin-homerun", rev = "62a095ba017e35e67fb48b44e2d5acea3b1608a7", optional = true }
# Only for `CURRENT_MC_VERSION`: which Minecraft the linked engine serves, so
# a host can pin the server's VERSION to it (`host_dispatch::pumpkin_serves`).
pumpkin-data = { git = "https://github.com/hintjen/Pumpkin-homerun", rev = "62a095ba017e35e67fb48b44e2d5acea3b1608a7", optional = true }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "time",
    # The device websocket's listener and its per-connection tasks. Compiled
    # only when a feature that needs them is on.
    "net",
    "sync",
    "io-util",
    "macros",
], optional = true }

# --- the device websocket -------------------------------------------------
#
# All behind `device-ws` and off by default, which is what keeps `npm test`
# device-free and seconds long. This is the heaviest thing in the crate by a
# distance, and it is here rather than in the hosts because the alternative is
# writing the same socket twice — see plans/device-websocket.md.
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
], optional = true }
# rustls rather than the platform's TLS: one behaviour on both platforms,
# no OpenSSL to cross-compile, and D3 needs rustls anyway to terminate TLS.
# `blocking` is for the fetcher, which is not an async program and should not
# become one: it runs inside the supervisor's own thread, its progress is
# reported by callback, and the only thing it waits on is one socket. reqwest
# stands up a small runtime for the blocking client itself, which is a cost
# paid once per download rather than a runtime this crate has to own.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "blocking",
    "stream",
], optional = true }
jsonwebtoken = { version = "9", default-features = false, optional = true }
# Terminating TLS ourselves, because the gateway is SNI passthrough — see
# plans/device-websocket.md. Same rustls the HTTP client above already pulls in,
# so there is one crypto provider in the build rather than two.
tokio-rustls = { version = "0.26", optional = true }
# The ACME half. Hand-rolling it is what the desktop did (~479 lines of
# TypeScript); there is no reason to do that again in a language with a
# maintained client.
#
# `default-features = false` drops its bundled hyper-rustls client, which builds
# on rustls-platform-verifier — and that needs a JavaVM and an Android Context
# handed to it over JNI before it can reach the system trust store. Without
# that initialisation it does not fail, it hangs: a device orders a certificate
# and never hears back. reqwest is already in this build, already reaches the
# API and Keycloak from Android, and carries its own roots, so it is the
# transport rather than a second TLS stack with a platform dependency.
# `aws-lc-rs` is kept: default-features drops the crypto provider too, and
# instant-acme needs one to sign its JWS. Same provider rustls already uses
# here, so there is one in the build rather than two.
instant-acme = { version = "0.8", default-features = false, features = [
    "aws-lc-rs",
], optional = true }
# Only to bridge instant-acme's request type onto reqwest. All three are
# already in the tree behind reqwest; naming them keeps the adapter honest.
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

# Both appear in Pumpkin's own public types — a `uuid::Uuid` in an operator
# entry, a `time::OffsetDateTime` in a ban — so seeding those lists means
# naming them. Versions match the workspace's, or Cargo would resolve two
# copies and the types would not be the same type.
uuid = { version = "1.24", optional = true }
time = { version = "0.3", optional = true }

# The console transports for descriptor-driven games. **Synchronous on
# purpose**: `tungstenite` rather than the `tokio-tungstenite` already here
# behind `device-ws`, because a console command is one request and one reply on
# loopback, and routing it through an async runtime would mean this crate owns
# a runtime in a build that otherwise needs none. Same version family as the
# async one, so there is one websocket implementation in the tree.
#
# No TLS feature: WebSocket RCON is plain `ws://` to a port on this machine
# that is bound to loopback and never published. A `wss://` here would mean the
# console had left the machine, which is what the device websocket is for.
# `handshake` is the client half; without it this is only a frame codec.
tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
], optional = true }

# Verifying a download. Hand-rolling it would be the same mistake `bundle.rs`
# argues against for signatures: this is the only thing standing between a
# vendor's CDN and an executable we hand to a player. Already in the tree
# through `ed25519-dalek`, so it adds nothing that was not compiled anyway.
sha2 = { version = "0.10", optional = true }

# Unpacking a runtime. `default-features = false` plus `deflate` keeps out
# bzip2, zstd and the AES stack -- a game server archive is deflate, and each
# of those is a decompressor that would be reachable from a vendor's bytes for
# no reason.
zip = { version = "2", default-features = false, features = [
    "deflate",
], optional = true }

serde_json = "1"
# Derive, for the one struct worth deriving: `EngineSettings` has fifteen
# fields and is rendered straight back over the C ABI. Everything else in this
# crate still parses `Value` by hand, which is the right call for a handful of
# arguments and the wrong one for this.
serde = { version = "1", features = ["derive"] }

# A facade, so it costs nothing when nothing logs. Declared unconditionally
# because two things need it on different platforms: android_logger below, and
# the backup engine's log sink — rustic reports skipped entries through
# `log::warn!`, and without a sink there is no message to classify.
log = "0.4"

# Only for the two signals the stop ladder needs. Rust's `Child::kill` is
# SIGKILL and nothing else, so a terminate rung — which is what lets a JVM run
# its shutdown hook and flush the world — has no std spelling.
libc = { version = "0.2", optional = true }

# The backup engine. iOS cannot spawn a process, so restic-as-a-binary is not
# available to it and the engine is linked instead. rustic is restic-format
# compatible in both directions (verified against the 0.18.0 build the desktop
# ships), which is what lets a phone and a desktop share one repository.
#
# `opendal` is deliberately off: the default feature set pulls
# opendal-service-ftp and suppaftp, and the API only ever hands out `rest:`
# repositories.
rustic_core = { version = "0.13", default-features = false, optional = true }
rustic_backend = { version = "0.7", default-features = false, features = [
    "rest",
], optional = true }
# rustic re-exports this; used for the `forget` cutoff, which needs a clock the
# pure decision layer deliberately does not have.
jiff = { version = "0.2", optional = true }

# The decisions every Homerun app shares — which jar, which tunnel config,
# what state a server is in. A path dependency rather than a workspace member
# on purpose: both crates carry their own [profile.release], and Cargo only
# honours profiles at a workspace root.
homerun-core = { path = "../homerun-core" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"

# Job Objects, and nothing else — see `job.rs` for what they buy and why the
# alternative was an orphaned game server holding its ports and its saves.
#
# There is no portable spelling for this: a Windows process tree is not a
# process group, `Child::kill` is one process, and `taskkill /T` walks parent
# links that a launcher-style executable has already broken by exiting. The
# only thing that reliably owns a subtree on Windows is a Job Object, and the
# only way to reach one is the Win32 API.
#
# Bindings rather than a wrapper, and no C or C++ anywhere in it -- which is
# not incidental: every Windows desktop target builds with `+crt-static` and
# `scripts/check-windows-runtime.js` fails the build on a vcruntime import,
# after a beta shipped binaries that died with 0xC0000135 before `main` on a
# PC with no Visual C++ Redistributable. kernel32 is part of Windows.
#
# `default-features = false` plus three feature groups rather than the lot, so
# what is compiled is the Win32 bindings used by ownership and platform I/O.
# The version is the
# one already in both lockfiles through other crates, so this adds a
# dependency edge and no new crate. Windows-only by target, so no Android, iOS
# or Linux build resolves it at all; behind `process-engine` as well, because
# a build with no child processes has nothing to own.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    # `CreateJobObjectW` takes a SECURITY_ATTRIBUTES pointer, so its binding
    # is gated on this even though the pointer passed is null.
    "Win32_Security",
    # DPAPI (`CryptProtectData`), which seals what a game's extension keeps --
    # a refresh token -- to this computer's user. `local_secret.rs`.
    "Win32_Security_Cryptography",
    # A directory junction, which is DeviceIoControl and nothing higher-level:
    # `std` has no API for one, and the alternative -- a symbolic link -- needs
    # a privilege a player's account does not have.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemServices",
    "Win32_System_JobObjects",
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds an IO_COUNTERS from here.
    "Win32_System_Threading",
], optional = true }

# rustic_core as published does not compile for aarch64-apple-ios: the dev_t
# cfg gates in backend/local_destination.rs list macos and openbsd but not
# ios, so `device` stays u64 where nix::mknod wants i32. Five lines, carried
# in hintjen/rustic-fork — the fork is upstream plus exactly that
# commit, so `main` there is also the branch an upstream PR opens from.
#
# Carried, not upstreamed — the same call `plans/ios.md` makes for the Pumpkin
# fork, and the fork is public now, so both can happen.
#
# That repository's `main` is upstream's `main` with the patch rebased on top,
# so it reads as exactly one commit ahead. Which means a rev pinned here may
# be an *unreleased* core — and `rustic_backend` from crates.io is compiled
# against the core it was released with. That pairing broke once before
# (`write_bytes` changed shape after 0.12.0 and backend 0.6.2 stopped
# building). So a repin is not just a rev bump: build `backup-engine` against
# the new rev before committing it, and if the backend no longer compiles,
# either wait for upstream's next release pair or pin a rev at the tag.
#
# Cargo only applies a `[patch]` whose version satisfies the requirement.
# When upstream cuts a release the crate version moves, and a 0.14 tree
# against the "0.13" above is dropped with nothing louder than
# `patch ... was not used` — bump `rustic_core` and `rustic_backend` above
# together with the rev.
#
# `[patch]` is not feature-gated, so an Android or host build resolves this too
# and warns that the patch went unused. That is expected, not a problem.
[patch.crates-io]
rustic_core = { git = "https://github.com/hintjen/rustic-fork", rev = "2c77cde6270db06b1f73d550dbef403f343ae9d6" }

[profile.release]
# The debug build of the server is ~1.8 GB, which is impractical on device.
opt-level = "z"
lto = true
strip = true

# `z` is right for Pumpkin and wrong for the backup engine: chunking, hashing
# and compression are its hot loops, and throughput is what decides whether a
# backup finishes inside the foreground window iOS gives us.
[profile.release.package.rustic_core]
opt-level = 3
[profile.release.package.rustic_backend]
opt-level = 3
[profile.release.package.zstd-sys]
opt-level = 3

# Unix-only: it saves the terminal's stdout with dup(2) and writes to it
# directly, because starting the engine replaces fd 1 with the console pipe.
# Without this, `cargo test` on Windows fails to link an example nobody asked
# it to build.
[[example]]
name = "boot_engine"
required-features = ["pumpkin-engine"]

[dev-dependencies]
# Tests only. `runtime_dispatch` decides whether the caller may block before
# handing work to the engine's runtime, and that rule shipped wrong — a command
# typed into the dashboard's console arrived on a device websocket task and
# panicked. Reproducing it needs a runtime and nothing else, so the test runs
# in the ordinary suite rather than behind `pumpkin-engine`, which would need
# the real server and a device. Dev-dependencies do not ship.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Tests only, and only to *sign* — the crate under test does the verifying.
# Pinning a pre-signed manifest as a constant instead would hide any change to
# the signed payload behind a hex blob nobody can diff. Already in the tree via
# homerun-core, so this adds nothing to what ships.
ed25519-dalek = "2"
