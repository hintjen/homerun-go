# The bridge contract is a gate, not a lint.
#
# A channel a host does not answer hangs a UI promise forever, and on device
# that looks like a frozen screen with no error — so a missing handler must
# break the build here rather than surface as a bug report. This runs while it
# still fails: the missing list is the remaining work.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    name: bridge/v1 coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm ci`: the only dependency is the UI bundle, which these scripts
      # do not need. The contract is vendored in shared/conformance/.
      - name: iOS
        run: node shared/conformance/check-coverage.js ios ios/HomerunHost/BridgeRouter.swift

      - name: Android
        run: node shared/conformance/check-coverage.js android android/app/src/main/java/app/gethomerun/mobile/BridgeRouter.kt

      # Coverage proves a channel is answered; this proves the host admits to
      # answering it. A router that gains a channel without a ledger entry is
      # a host an over-the-air bundle can call something unanswerable on, and
      # the ledger is the only thing that knows.
      - name: Host revision ledger
        run: node scripts/check-host-revision.js

      # And this one proves the host tells the truth about what it supports.
      # Not covered by either of the above: capabilities are injected, not
      # dispatched, so nothing that reads the router can see them drift.
      #
      # It also checks the bundle public key: both hosts transcribe it by hand
      # and `scripts/bundle-key.js` is the third copy, the one that verifies a
      # manifest fetched from the CDN.
      - name: Capability parity
        run: node scripts/check-capabilities.js

      # `ui-bundle.js` is the only JavaScript here that decides whether to
      # TRUST something, and every one of its checks fails open if it is
      # wrong — a signature check that always returns true looks exactly like
      # a working build. So each guard is put against an input that should
      # trip it. Belongs on this job for the same reason as the rest: node
      # builtins only, no `npm ci`, no secrets.
      - name: UI bundle guards
        run: node scripts/check-ui-bundle.js

  # The FFI tests (`npm run test:rust`) are not here: `pumpkin` is a git
  # dependency on the still-private hintjen/Pumpkin, and Cargo resolves
  # optional dependencies whether or not their feature is enabled, so even a
  # default-feature `cargo test` has to clone it. They run in the release
  # repo's CI until that fork goes public; run them locally with access.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: a secret in a reachable commit is public
          # whether or not HEAD carries it.
          fetch-depth: 0

      - name: Scan history
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --log-opts="--all" --redact .
