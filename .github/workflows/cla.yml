# First-time contributors sign the CLA (CLA.md) by posting the comment the
# bot asks for on their PR. Signatures are recorded on the `cla-signatures`
# branch of this repository. Maintainers who committed before the repo went
# public are allowlisted.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/hintjen/homerun-go/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "shuabritt,justin-russell,*[bot]"
